<circle cx="66.0" cy="56.0" r="26.0" fill="#e6dcee" stroke="#482870" stroke-width="3"/>
<text x="66.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="8.8" fill="#2d1a4a">Concept</text>
<text x="66.0" y="64.8" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="3.9" fill="#2d1a4a" opacity="0.8"></text>
<text x="108.0" y="48.0" font-family="Fira Sans" font-weight="500" font-size="15" fill="#2c2c2a">Block 3 -- terminology junction, concept level</text>
<text x="108.0" y="68.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">terminology junction</text>
<rect x="60.0" y="140.0" width="230.0" height="90.0" rx="10" fill="#fde8dd" stroke="#b5512a" stroke-width="1"/>
<text x="175.0" y="177.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#4a1b0c">Node object</text>
<text x="175.0" y="197.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#4a1b0c" opacity="0.75">as concept</text>
<line x1="290.0" y1="185.0" x2="390.0" y2="185.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340.0" y="171.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">skos:exactMatch</text>
<rect x="390.0" y="140.0" width="230.0" height="90.0" rx="10" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1"/>
<text x="505.0" y="177.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#173404">Terminology concept</text>
<text x="505.0" y="197.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#173404" opacity="0.75">e.g. Getty AAT</text>
<text x="40.0" y="280.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">A node object — an object type, a material — is matched to a concept in a</text>
<text x="40.0" y="300.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">controlled vocabulary. This is a graded matching relation, not an identity claim.</text>
