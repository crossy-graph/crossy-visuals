<svg width="1050" height="460" viewBox="0 0 1050 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SHACL validation gates publication</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="66.0" cy="56.0" r="26.0" fill="#f5dede" stroke="#a03030" stroke-width="3"/>
<text x="66.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="8.8" fill="#501313">Validate</text>
<text x="66.0" y="64.8" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="3.9" fill="#501313" opacity="0.8"></text>
<text x="108.0" y="48.0" font-family="Fira Sans" font-weight="500" font-size="15" fill="#2c2c2a">Block 4 -- validate</text>
<text x="108.0" y="68.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">SHACL gate</text>
<rect x="40.0" y="140.0" width="220.0" height="90.0" rx="10" fill="#dde9fb" stroke="#2a5ab5" stroke-width="1"/>
<text x="150.0" y="177.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#042c53">SKOS / OWL</text>
<text x="150.0" y="197.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#042c53" opacity="0.75">serialised crosswalks</text>
<line x1="260.0" y1="185.0" x2="350.0" y2="185.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="350.0" y="140.0" width="230.0" height="90.0" rx="10" fill="#f5dede" stroke="#a03030" stroke-width="1"/>
<text x="465.0" y="177.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#501313">SHACL validation</text>
<text x="465.0" y="197.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#501313" opacity="0.75">R1–R5 as shapes</text>
<line x1="580.0" y1="170.0" x2="670.0" y2="160.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="625.0" y="157.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">valid</text>
<rect x="670.0" y="130.0" width="170.0" height="50.0" rx="10" fill="#f5f0d8" stroke="#8a7420" stroke-width="1"/>
<text x="755.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#412402">Publish</text>
<line x1="465.0" y1="230.0" x2="330.0" y2="320.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="397.5" y="267.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">invalid</text>
<rect x="235.0" y="320.0" width="190.0" height="50.0" rx="10" fill="#e8e0f5" stroke="#5b3fa0" stroke-width="1"/>
<text x="330.0" y="345.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#26215c">Back to curation</text>
<text x="40.0" y="420.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">The direction of the failure path matters: invalid output returns to curation, not to a</text>
<text x="40.0" y="440.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">downstream fix -- a fix applied in the pipeline would be lost on the next export.</text>
</svg>
