<svg width="980" height="340" viewBox="0 0 980 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>R3 and R4: the metadata track</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="66.0" cy="56.0" r="26.0" fill="#dde9fb" stroke="#2a5ab5" stroke-width="3"/>
<text x="66.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="8.8" fill="#042c53">R3·R4</text>
<text x="66.0" y="64.8" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="3.9" fill="#042c53" opacity="0.8"></text>
<text x="108.0" y="48.0" font-family="Fira Sans" font-weight="500" font-size="15" fill="#2c2c2a">Block 2 -- metadata track</text>
<text x="108.0" y="68.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">R3, R4</text>
<rect x="40.0" y="130.0" width="220.0" height="90.0" rx="10" fill="#dde9fb" stroke="#2a5ab5" stroke-width="1"/>
<text x="150.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#042c53">Application metadata</text>
<text x="150.0" y="187.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#042c53" opacity="0.75">schema element</text>
<line x1="260.0" y1="175.0" x2="330.0" y2="175.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="295.0" y="161.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">R3</text>
<rect x="330.0" y="130.0" width="170.0" height="90.0" rx="10" fill="#dde9fb" stroke="#2a5ab5" stroke-width="1"/>
<text x="415.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#042c53">OCMDP term</text>
<text x="415.0" y="187.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#042c53" opacity="0.75">core term</text>
<line x1="500.0" y1="175.0" x2="570.0" y2="175.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="535.0" y="161.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">R4</text>
<rect x="570.0" y="130.0" width="250.0" height="90.0" rx="10" fill="#f5f0d8" stroke="#8a7420" stroke-width="1"/>
<text x="695.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#412402">NCMDP element</text>
<text x="695.0" y="187.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#412402" opacity="0.75">NFDI Core Metadata Profile</text>
<text x="40.0" y="260.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">R3 — every element of an application metadata schema maps to an OCMDP term (a catch-all term is a legitimate, visible outcome)</text>
<text x="40.0" y="280.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">R4 — every OCMDP term is crosswalked to the NCMDP (skos:exactMatch, closeMatch or broadMatch)</text>
</svg>
