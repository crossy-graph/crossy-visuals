<svg width="1080" height="340" viewBox="0 0 1080 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>R1 and R2: the ontology track</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="66.0" cy="56.0" r="26.0" fill="#fde8dd" stroke="#b5512a" stroke-width="3"/>
<text x="66.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="8.8" fill="#4a1b0c">R1·R2</text>
<text x="66.0" y="64.8" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="3.9" fill="#4a1b0c" opacity="0.8"></text>
<text x="108.0" y="48.0" font-family="Fira Sans" font-weight="500" font-size="15" fill="#2c2c2a">Block 2 -- ontology track</text>
<text x="108.0" y="68.0" font-family="Fira Sans" font-size="12" fill="#5f5e5a">R1, R2</text>
<rect x="40.0" y="130.0" width="220.0" height="90.0" rx="10" fill="#fde8dd" stroke="#b5512a" stroke-width="1"/>
<text x="150.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#4a1b0c">Application ontology</text>
<text x="150.0" y="187.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#4a1b0c" opacity="0.75">class</text>
<line x1="260.0" y1="175.0" x2="350.0" y2="175.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="305.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">R1</text>
<rect x="350.0" y="130.0" width="190.0" height="90.0" rx="10" fill="#fde8dd" stroke="#b5512a" stroke-width="1"/>
<text x="445.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#4a1b0c">CIDOC CRM class</text>
<text x="445.0" y="187.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#4a1b0c" opacity="0.75">+ extensions</text>
<line x1="540.0" y1="175.0" x2="630.0" y2="175.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="585.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">R2</text>
<rect x="630.0" y="130.0" width="220.0" height="90.0" rx="10" fill="#f5f0d8" stroke="#8a7420" stroke-width="1"/>
<text x="740.0" y="167.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="14" fill="#412402">BFO / NFDIcore</text>
<text x="740.0" y="187.0" text-anchor="middle" font-family="Fira Sans" font-size="12" fill="#412402" opacity="0.75">reference alignment</text>
<text x="40.0" y="260.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">R1 — every class of an application ontology references a CIDOC CRM class (rdfs:subClassOf or owl:equivalentClass)</text>
<text x="40.0" y="280.0" font-family="Fira Sans" font-size="13" fill="#5f5e5a">R2 — CIDOC CRM classes used are themselves aligned to BFO and, through it, NFDIcore</text>
</svg>
