<svg width="980" height="620" viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Types of correspondence used by the Crossys</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="44" font-family="Fira Sans" font-weight="500" font-size="17" fill="#2c2c2a">Block 2 -- correspondence types</text>
<text x="40" y="66" font-family="Fira Sans" font-size="13" fill="#5f5e5a">what a crosswalk statement is allowed to assert, by level</text>
<rect x="40.0" y="90.0" width="900.0" height="120.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="56.0" y="116.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Ontology level — classes / nodes</text>
<rect x="70.0" y="140.0" width="231.8" height="60.0" rx="10" fill="#fde8dd" stroke="#b5512a" stroke-width="1"/>
<text x="185.9" y="170.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#4a1b0c">Application ontology class</text>
<line x1="301.8" y1="170.0" x2="461.8" y2="170.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="381.8" y="162.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">subClassOf · equivalentClass</text>
<rect x="461.8" y="140.0" width="180.0" height="60.0" rx="10" fill="#fde8dd" stroke="#b5512a" stroke-width="1"/>
<text x="551.8" y="170.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#4a1b0c">CIDOC CRM class</text>
<rect x="40.0" y="230.0" width="900.0" height="120.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="56.0" y="256.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Metadata level — properties / edges</text>
<rect x="70.0" y="280.0" width="247.5" height="60.0" rx="10" fill="#dde9fb" stroke="#2a5ab5" stroke-width="1"/>
<text x="193.8" y="310.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#042c53">Application metadata element</text>
<line x1="317.5" y1="310.0" x2="517.5" y2="310.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="417.5" y="302.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">exactMatch … relatedMatch</text>
<rect x="517.5" y="280.0" width="150.0" height="60.0" rx="10" fill="#dde9fb" stroke="#2a5ab5" stroke-width="1"/>
<text x="592.5" y="310.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#042c53">OCMDP term</text>
<rect x="40.0" y="370.0" width="900.0" height="220.0" rx="16" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="56.0" y="396.0" font-family="Fira Sans" font-weight="500" font-size="13" fill="#888780">Terminology level — concepts / individuals</text>
<rect x="70.0" y="420.0" width="210.0" height="55.0" rx="10" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1"/>
<text x="175.0" y="447.5" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#173404">Node object as concept</text>
<line x1="280.0" y1="447.0" x2="430.0" y2="447.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="355.0" y="439.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">skos:exactMatch</text>
<rect x="430.0" y="420.0" width="190.0" height="55.0" rx="10" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1"/>
<text x="525.0" y="447.5" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#173404">Terminology concept</text>
<rect x="70.0" y="500.0" width="318.1" height="55.0" rx="10" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1"/>
<text x="229.0" y="527.5" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#173404">Individual (a specific place, object)</text>
<line x1="388.1" y1="527.0" x2="538.1" y2="527.0" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="463.1" y="519.0" text-anchor="middle" font-family="Fira Sans" font-weight="500" font-size="12" fill="#2c2c2a">owl:sameAs</text>
<rect x="538.1" y="500.0" width="170.0" height="55.0" rx="10" fill="#e2f0dd" stroke="#3d7a2a" stroke-width="1"/>
<text x="623.1" y="527.5" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-weight="500" font-size="14" fill="#173404">Authority item</text>
<text x="70" y="585" font-family="Fira Sans" font-size="12" fill="#5f5e5a">keeping the two apart is deliberate: sameAs on a concept, or exactMatch on an individual, is a modelling error (primer 4.4.2)</text>
</svg>
